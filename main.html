    function cambiarPosicionYmas(){
        let esfera=document.getElementById("esfera");
        let posicionActual = esfera.getAttribute("position");
        posiciony+=.5;
        esfera.setAttribute("position", {x: posicionActual.x, y: posiciony, z: posicionActual.z});
    }

    function cambiarPosicionYmenos(){
        let esfera=document.getElementById("esfera");
        let posicionActual = esfera.getAttribute("position");
        posiciony-=.5;
        esfera.setAttribute("position", {x: posicionActual.x, y: posiciony, z: posicionActual.z});
    }

    function cambiarPosicionXmas(){
        let esfera=document.getElementById("esfera");
        let posicionActual = esfera.getAttribute("position");
        posicionx+=.5;
        esfera.setAttribute("position", {x: posicionx, y: posicionActual.y, z: posicionActual.z});
    }

    function cambiarPosicionXmenos(){
        let esfera=document.getElementById("esfera");
        let posicionActual = esfera.getAttribute("position");
        posicionx-=.5;
        esfera.setAttribute("position", {x: posicionx, y: posicionActual.y, z: posicionActual.z});
    }

    function cambiarPosicionZ(){
        let esfera=document.getElementById("esfera");
        let posicionActual = esfera.getAttribute("position");
        posicionz+=.5;
        esfera.setAttribute("position", {x: posicionActual.x, y: posicionActual.y, z: posicionz});
    }

    function cambiarcolor(){
        let esfera=document.getElementById("esfera");
        let colorActual = esfera.getAttribute("color");
        
        if (colorActual === "red"){
            esfera.setAttribute("color", "yellow");
        } else if (colorActual === "yellow"){
            esfera.setAttribute("color", "red");
        }
    }
</script>
