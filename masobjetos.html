<!DOCTYPE html>
<html>
  <head>
    <title>Hello, WebVR! - A-Frame</title>
    <meta name="description" content="Hello, WebVR! - A-Frame">
    <script src="https://aframe.io/releases/1.0.0/aframe.min.js"></script>
  </head>
  <body>

    <script>

    AFRAME.registerComponent('cubo', {
        schema: {
            color: { type: 'color', default: '#4CC3D9' }
        },
        init: function() {
            const color = this.data.color;

            this.el.innerHTML = `
        <a-box position="0 1 -3" rotation="0 45 0" color="${color}"></a-box>
      
        `;
        }
    });
AFRAME.registerComponent('esfera', {
    schema: {
            color: { type: 'color', default: '#4CC3D9' }
        },
    init: function() {
        const color = this.data.color;
        this.el.innerHTML = `
        <a-sphere position="0 1.25 -5" radius="1.25" color="${color}"></a-sphere>
        `;  

    }
});
AFRAME.registerComponent('cilindro', {
    schema: {
            color: { type: 'color', default: '#4CC3D9' }
        },
    init: function() {
        const color = this.data.color;
        this.el.innerHTML = `
        <a-cylinder position="0 1.25 -5" radius="1.25" height="2" color="${color}"></a-cylinder>
        `;  

    }
});
AFRAME.registerComponent('cono', {
    schema: {
            color: { type: 'color', default: '#4CC3D9' }
        },
    init: function() {
        const color = this.data.color;
        this.el.innerHTML = `
        <a-cone position="0 1 -3" radius-bottom="1" height="2" color="#FFC65D"></a-cone>
        `;  

    }
});
    function randomHexColor() {
        return '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');
    }

    function ponercubo(){
        const cubox = document.getElementById("cubox").value; 
        const cuboy = document.getElementById("cuboy").value; 
        const cuboz = document.getElementById("cuboz").value;

        const sceneEl = document.querySelector('a-scene');
        const cuboEl = document.createElement('a-entity');
        const randomColor = randomHexColor();
        cuboEl.setAttribute('position', {x: cubox, y: cuboy, z: cuboz});
        cuboEl.setAttribute('cubo', { color: randomColor });
        sceneEl.appendChild(cuboEl);
    }

    function poneresfera(){
        const esferax = document.getElementById("esferax").value; 
        const esferay = document.getElementById("esferay").value; 
        const esferaz = document.getElementById("esferaz").value;

        const sceneEl = document.querySelector('a-scene');
        const esferaEl = document.createElement('a-entity');
        const randomColor = randomHexColor();
        esferaEl.setAttribute('position', {x: esferax, y: esferay, z: esferaz});
        esferaEl.setAttribute('esfera', { color: randomColor });
        sceneEl.appendChild(esferaEl);
    }

    function ponercono(){
        const conox = document.getElementById("conox").value; 
        const conoy = document.getElementById("conoy").value; 
        const conoz = document.getElementById("conoz").value;

        const sceneEl = document.querySelector('a-scene');
        const conoEl = document.createElement('a-entity');
        const randomColor = randomHexColor();
        conoEl.setAttribute('position', {x: conox, y: conoy, z: conoz});
        
        conoEl.setAttribute('cono', { color: randomColor });
        sceneEl.appendChild(conoEl);
    }

    function ponercilindro(){
        const cilindrox = document.getElementById("cilindrox").value; 
        const cilindroy = document.getElementById("cilindroy").value; 
        const cilindroz = document.getElementById("cilindroz").value;

        const sceneEl = document.querySelector('a-scene');
        const cilindroEl = document.createElement('a-entity');
        const randomColor = randomHexColor();
        cilindroEl.setAttribute('position', {x: cilindrox, y: cilindroy, z: cilindroz});
        cilindroEl.setAttribute('cilindro', { color: randomColor });
        sceneEl.appendChild(cilindroEl);
    }

</script>

    <a-scene>
        <div id="global">
        <div id="cubovalores"><button id="cubo" onclick="ponercubo()">Añadir Cubo</button> <input id="cubox" type="text">ingresa x:</input> <input id="cuboy" type="text">ingresa y:</input> <input id="cuboz" type="text">ingresa z:</input></div>
        <div id="esferavalores"><button onclick="poneresfera()">añadir esfera</button><input id="esferax" type="text">ingresa x:</input> <input id="esferay" type="text">ingresa y:</input> <input id="esferaz" type="text">ingresa z:</input> </div>
        <div id="conovalores"><button onclick="ponercono()">añadir cono</button><input id="conox" type="text">ingresa x:</input> <input id="conoy" type="text">ingresa y:</input> <input id="conoz" type="text">ingresa z:</input> </div>
        <div id="cilindrovalores"><button onclick="ponercilindro()">añadir cilindro</button><input id="cilindrox" type="text">ingresa x:</input> <input id="cilindroy" type="text">ingresa y:</input> <input id="cilindroz" type="text">ingresa z:</input> </div>


        </div>
      <a-plane position="0 0 -4" rotation="-90 0 0" width="15" height="20" color="green"></a-plane>
      <a-sky color="turquoise"></a-sky>
    </a-scene>



    <style>
    #global{
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 999;
        background-color: rgba(255, 255, 255, 0.8);
        padding: 10px;
        border-radius: 5px;
    }
       
        

        
    </style>
  </body>
</html>
